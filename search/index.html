<!doctype html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Search | Ansilian</title>
    <meta name="description" content="Search all Ansilian archives from one place." />
    <link rel="icon" type="image/png" href="/assets/ansilian.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900&family=Noto+Naskh+Arabic:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=1" />
</head>
<body class="universal-search-page">
    <div data-component="navbar"></div>
    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/nav.js"></script>

    <main id="main-content" class="page-content">
        <h1 class="page-title">universal search</h1>
        <p class="status-text" style="margin-top:-18px; margin-bottom:24px;">
            Search across every archive and use the same actions available on the original page.
        </p>

        <div class="universal-search-layout">
            <aside class="universal-search-filters" id="universal-filters" aria-label="Search filters"></aside>

            <section class="universal-search-results" aria-label="Search results">
                <div class="universal-search-toolbar">
                    <label class="sr-only" for="universal-search-input">Search all Ansilian content</label>
                    <input
                        type="search"
                        id="universal-search-input"
                        class="search-input"
                        placeholder="search everything..."
                        autocomplete="off"
                    />
                </div>
                <div class="universal-search-results-scroll" id="universal-results" aria-live="polite">
                    <p class="status-text">loading...</p>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/search.js"></script>
    <script src="/js/universal-search.js"></script>
    <div data-component="footer"></div>
</body>
</html>
