<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Search - Ansilian</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/search.css">
</head>
<body>
  <div id="navbar-placeholder"></div>

  <main class="search-main-container">
    <header class="search-header">
      <h1>Universal Search</h1>

      <!-- Primary Search Bar -->
      <div class="search-input-wrapper">
        <input type="text" id="universal-search-input" placeholder="Search across articles, archivers, customs, skins..." autocomplete="off">
        <button id="clear-search-btn" aria-label="Clear Search">&times;</button>
      </div>

      <!-- Filtering System -->
      <div class="filter-controls-container">
        <!-- Category (Page) Selector -->
        <div class="filter-group">
          <label for="category-select">Category (Page):</label>
          <select id="category-select">
            <option value="all">All Categories</option>
            <option value="articles">Articles</option>
            <option value="ss-hub-articles">SS-Hub Articles</option>
            <option value="archivers">Archivers</option>
            <option value="customs">Customs & Skins</option>
          </select>
        </div>

        <!-- Dynamic Sub-filters per Page/Category -->
        <div id="dynamic-subfilters" class="dynamic-subfilters">
          <!-- Author Filter (Visible for Articles/SS-Hub) -->
          <div class="filter-group sub-filter" data-category="articles ss-hub-articles archivers all" style="display: none;">
            <label for="author-select">Author:</label>
            <select id="author-select">
              <option value="all">All Authors</option>
            </select>
          </div>

          <!-- Type/Tag Filter (Visible for Customs/Archivers) -->
          <div class="filter-group sub-filter" data-category="customs archivers all" style="display: none;">
            <label for="tag-select">Tag / Type:</label>
            <select id="tag-select">
              <option value="all">All Tags</option>
            </select>
          </div>
        </div>
      </div>
    </header>

    <!-- Results Section -->
    <section class="search-results-section">
      <div class="results-header">
        <h2 id="results-title">Latest Added Items</h2>
        <span id="results-count" class="results-count"></span>
      </div>
      <div id="search-results-grid" class="results-grid">
        <!-- Dynamically populated by search.js -->
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
