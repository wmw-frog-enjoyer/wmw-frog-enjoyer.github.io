<!doctype html><html><head><meta charset='utf-8'><title>Official Maps</title><link rel='stylesheet' href='style.css'></head><body><h1>Official Maps</h1><div id='cards'></div><script>
fetch('maps.json').then(r=>r.json()).then(ms=>{const c=document.getElementById('cards');ms.forEach(m=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<h2>${m.name}</h2><p>${m.artist}</p><p>Mapper: ${m.mapper}</p><p>Rating: ${m.rating}</p><p>${m.patterns.join(', ')}</p><a href='${m.video}'>Showcase</a>`;c.appendChild(d);});});
</script></body></html>
