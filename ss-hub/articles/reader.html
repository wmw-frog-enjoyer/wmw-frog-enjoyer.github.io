<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ansilian</title>
        <link rel="icon" type="image/png" href="/assets/ansilian.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../style.css" />
        <link rel="stylesheet" href="style.css?v=1" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

        <style>
            /* ── progress bar — right edge ── */
            .reading-progress-track {
                position: fixed;
                right: 0;
                top: 0;
                width: 6px;
                height: 100vh;
                background: rgba(255, 255, 255, 0.08);
                z-index: 999;
            }
            .reading-progress-fill {
                width: 100%;
                height: 0%;
                background: rgba(255, 255, 255, 0.55);
                transition: height 0.08s ease;
                border-radius: 0 0 3px 3px;
            }

            /* ── outer layout: left gap | content | right gap ── */
            .reader-layout {
                display: grid;
                grid-template-columns: 1fr minmax(0, 850px) 1fr;
                margin: 60px 0;
            }

            /* ── left column: Obsidian-style TOC ── */
            .toc-column {
                display: flex;
                justify-content: flex-end;
                padding-right: 40px;
            }

            .toc-widget {
                position: sticky;
                top: 80px;
                width: 180px;
                align-self: flex-start;
            }

            /* "on this page" toggle — plain text, no border/background */
            .toc-toggle {
                display: flex;
                align-items: center;
                gap: 6px;
                background: none;
                border: none;
                padding: 0;
                cursor: pointer;
                color: rgba(255, 255, 255, 0.5);
                font-family: "Inter", sans-serif;
                font-size: 13px;
                font-weight: 400;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                transition: color 0.15s ease;
                margin-bottom: 10px;
            }
            .toc-toggle:hover {
                color: rgba(255, 255, 255, 0.85);
            }

            .toc-arrow {
                font-size: 10px;
                transition: transform 0.2s ease;
                color: rgba(255, 255, 255, 0.3);
            }
            .toc-arrow.open {
                transform: rotate(180deg);
            }

            /* chapter links — plain text only, Obsidian style */
            .toc-list {
                display: flex;
                flex-direction: column;
                gap: 0;
                padding-left: 2px;
                border-left: 1px solid rgba(255, 255, 255, 0.1);
            }

            .toc-item {
                display: block;
                font-family: "Inter", sans-serif;
                font-size: 14px;
                font-weight: 300;
                color: rgba(255, 255, 255, 0.4);
                text-decoration: none;
                padding: 5px 0 5px 12px;
                transition: color 0.12s ease;
                line-height: 1.4;
            }
            .toc-item:hover {
                color: rgba(255, 255, 255, 0.9);
            }

            /* ── center column ── */
            .page-content {
                padding: 0 24px;
                text-align: left;
                min-width: 0;
            }

            /* ── right column: stats centered in the gap ── */
            .stats-column {
                display: flex;
                justify-content: center;   /* centered in gap2 */
                align-items: flex-start;
                padding-top: 0;
            }

            .reading-stats {
                width: 110px;
                display: flex;
                flex-direction: column;
                gap: 24px;
                margin-top: 148px; /* align with article body start */
            }

            .stat-item {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .stat-item-label {
                font-family: "Inter", sans-serif;
                font-size: 11px;
                font-weight: 300;
                color: rgba(255, 255, 255, 0.22);
                text-transform: uppercase;
                letter-spacing: 0.07em;
            }
            .stat-item-value {
                font-family: "Inter", sans-serif;
                font-size: 20px;
                font-weight: 200;
                color: rgba(255, 255, 255, 0.65);
                letter-spacing: -0.3px;
            }

            /* hide side columns on narrow screens */
            @media (max-width: 1100px) {
                .reader-layout {
                    grid-template-columns: 0 minmax(0, 850px) 0;
                }
                .toc-column,
                .stats-column {
                    display: none;
                }
                .page-content {
                    padding: 0 16px;
                }
            }

            /* ── footer ── */
            .reader-footer {
                margin-top: 80px;
                padding-top: 40px;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
            }
            .footer-title {
                font-family: "Inter", sans-serif;
                font-size: 18px;
                font-weight: 300;
                color: rgba(255, 255, 255, 0.35);
                text-transform: uppercase;
                letter-spacing: 0.07em;
                margin-bottom: 24px;
            }
            .footer-cards {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-bottom: 40px;
            }
            .footer-card {
                display: block;
                text-decoration: none;
                color: white;
                padding: 20px 22px;
                border: 1px solid rgba(255, 255, 255, 0.07);
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.02);
                transition: background 0.15s ease, border-color 0.15s ease;
            }
            .footer-card:hover {
                background: rgba(255, 255, 255, 0.05);
                border-color: rgba(255, 255, 255, 0.14);
            }
            .footer-card-title {
                font-family: "Inter", sans-serif;
                font-size: 24px;
                font-weight: 400;
                margin-bottom: 8px;
            }
            .footer-card-meta {
                font-family: "Inter", sans-serif;
                font-size: 16px;
                font-weight: 300;
                color: rgba(255, 255, 255, 0.35);
            }
            .footer-back {
                display: inline-block;
                font-family: "Inter", sans-serif;
                font-size: 20px;
                font-weight: 300;
                color: rgba(255, 255, 255, 0.4);
                text-decoration: none;
                margin-bottom: 80px;
                transition: color 0.15s ease;
            }
            .footer-back:hover {
                color: rgba(255, 255, 255, 0.85);
            }

            /* ── scroll to top ── */
            .scroll-top-btn {
                position: fixed;
                bottom: 32px;
                right: 32px;
                width: 56px;
                height: 56px;
                background: rgba(255, 255, 255, 0.08);
                border: 2px solid rgba(255, 255, 255, 0.18);
                border-radius: 50%;
                color: white;
                font-size: 24px;
                font-weight: 300;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.2s ease, background 0.15s ease;
                z-index: 998;
                line-height: 1;
            }
            .scroll-top-btn.visible {
                opacity: 1;
                pointer-events: auto;
            }
            .scroll-top-btn:hover {
                background: rgba(255, 255, 255, 0.15);
            }
        </style>
    </head>
    <body>
        <div class="reading-progress-track">
            <div class="reading-progress-fill" id="progress-fill"></div>
        </div>

        <button class="scroll-top-btn" id="scroll-top-btn"
            onclick="window.scrollTo({top:0,behavior:'smooth'})"
            title="back to top">↑</button>

        <div id="topbar-container"></div>
        <script src="/nav.js"></script>

        <div class="reader-layout">

            <!-- left: obsidian-style TOC -->
            <div class="toc-column">
                <div class="toc-widget" id="toc-widget" style="display:none;">
                    <button class="toc-toggle" onclick="toggleToc()">
                        <span class="toc-arrow" id="toc-arrow">▾</span>
                        <span>on this page</span>
                    </button>
                    <div class="toc-list" id="toc-list" style="display:none;"></div>
                </div>
            </div>

            <!-- center: article -->
            <div class="page-content">
                <a class="back-link" href="index.html">← back to articles</a>

                <div class="post-preface">
                    <span class="preface-number" id="preface-number"></span>
                    <div class="preface-right">
                        <span class="preface-author" id="preface-author"></span>
                        <span class="preface-date" id="preface-date"></span>
                    </div>
                </div>
                <hr class="preface-divider" />

                <div id="preface-tags" class="preface-tags"></div>
                <div id="post-body" class="post-body">
                    <p class="status-text">loading...</p>
                </div>

                <div class="reader-footer" id="reader-footer" style="display:none;">
                    <div class="footer-title">latest articles</div>
                    <div class="footer-cards" id="footer-cards"></div>
                    <a class="footer-back" href="index.html">← back to articles</a>
                </div>
            </div>

            <!-- right: reading stats centered in gap -->
            <div class="stats-column">
                <div class="reading-stats">
                    <div class="stat-item">
                        <span class="stat-item-label">words</span>
                        <span class="stat-item-value" id="stat-words">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-item-label">characters</span>
                        <span class="stat-item-value" id="stat-chars">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-item-label">read time</span>
                        <span class="stat-item-value" id="stat-time">—</span>
                    </div>
                </div>
            </div>

        </div>

        <script>
            function updateProgress() {
                const body = document.getElementById("post-body");
                if (!body) return;
                const articleTop = body.getBoundingClientRect().top + window.scrollY;
                const percent = Math.min(100, Math.max(0,
                    ((window.scrollY - articleTop) / body.offsetHeight) * 100
                ));
                document.getElementById("progress-fill").style.height = percent + "%";

                const btn = document.getElementById("scroll-top-btn");
                btn.classList.toggle("visible", window.scrollY > 300);
            }
            window.addEventListener("scroll", updateProgress, { passive: true });

            let tocOpen = false;
            function toggleToc() {
                tocOpen = !tocOpen;
                document.getElementById("toc-list").style.display = tocOpen ? "flex" : "none";
                document.getElementById("toc-arrow").classList.toggle("open", tocOpen);
            }

            function buildToc() {
                const headings = document.getElementById("post-body").querySelectorAll("h2");
                if (headings.length === 0) return;

                const list = document.getElementById("toc-list");
                headings.forEach((h, i) => {
                    if (!h.id) h.id = `chapter-${i + 1}`;
                    const link = document.createElement("a");
                    link.className = "toc-item";
                    link.href = `#${h.id}`;
                    link.textContent = h.textContent;
                    link.addEventListener("click", (e) => {
                        e.preventDefault();
                        h.scrollIntoView({ behavior: "smooth", block: "start" });
                    });
                    list.appendChild(link);
                });

                document.getElementById("toc-widget").style.display = "block";
            }

            function computeStats(markdown) {
                const plain = markdown
                    .replace(/```[\s\S]*?```/g, "")
                    .replace(/`[^`]+`/g, "")
                    .replace(/#+\s/g, "")
                    .replace(/[*_~>]/g, "")
                    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
                    .trim();
                const words = plain.split(/\s+/).filter(Boolean).length;
                const chars = plain.replace(/\s/g, "").length;
                const minutes = Math.ceil(words / 200);
                return { words, chars, timeLabel: minutes === 1 ? "1 min" : `${minutes} min` };
            }

            function loadLatestArticles(currentId, allPosts) {
                const latest = allPosts
                    .filter((p) => p.id !== currentId)
                    .sort((a, b) => Number(b.id) - Number(a.id))
                    .slice(0, 3);
                if (latest.length === 0) return;

                document.getElementById("footer-cards").innerHTML = latest.map((p) => `
                    <a class="footer-card" href="reader.html?post=${p.id}">
                        <div class="footer-card-title">${p.title}</div>
                        <div class="footer-card-meta">${p.author} · ${p.date}</div>
                    </a>
                `).join("");

                document.getElementById("reader-footer").style.display = "block";
            }

            async function loadPost() {
                const postBody = document.getElementById("post-body");
                const params = new URLSearchParams(window.location.search);
                const postId = params.get("post");

                if (!postId) {
                    postBody.innerHTML = '<p class="status-text">no article specified.</p>';
                    return;
                }

                try {
                    const metaResponse = await fetch("posts/posts.json");
                    const allPosts = await metaResponse.json();
                    const meta = allPosts.find((p) => p.id === postId);

                    if (meta) {
                        document.getElementById("preface-number").textContent = `#${meta.id}`;
                        document.getElementById("preface-author").textContent = meta.author;
                        document.getElementById("preface-date").textContent = meta.date;
                        document.title = `${meta.title} — Ansilian`;

                        if (meta.tags && meta.tags.length > 0) {
                            document.getElementById("preface-tags").innerHTML =
                                meta.tags.map((t) => `<span class="preface-tag">${t}</span>`).join("");
                        }
                    }

                    const mdResponse = await fetch(`posts/${postId}.md`);
                    if (!mdResponse.ok) {
                        postBody.innerHTML = '<p class="status-text">article not found.</p>';
                        return;
                    }

                    const markdown = await mdResponse.text();
                    const { words, chars, timeLabel } = computeStats(markdown);
                    document.getElementById("stat-words").textContent = words.toLocaleString();
                    document.getElementById("stat-chars").textContent = chars.toLocaleString();
                    document.getElementById("stat-time").textContent = timeLabel;

                    const processed = markdown.replace(/([^\n])\n([^\n])/g, "$1  \n$2");
                    postBody.innerHTML = marked.parse(processed);

                    buildToc();
                    updateProgress();
                    loadLatestArticles(postId, allPosts);
                } catch (error) {
                    postBody.innerHTML = '<p class="status-text">could not load article.</p>';
                    console.error(error);
                }
            }

            loadPost();
        </script>
    </body>
</html>
