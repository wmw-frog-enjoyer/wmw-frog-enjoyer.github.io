<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Ansilian</title>
        <link rel="icon" type="image/png" href="/assets/ansilian.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../style.css" />
        <link rel="stylesheet" href="style.css?v=1" />

        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

        <style>
            /* progress bar — fixed on the left edge of the screen */
            .reading-progress-track {
                position: fixed;
                left: 0;
                top: 0;
                width: 3px;
                height: 100vh;
                background: rgba(255, 255, 255, 0.06);
                z-index: 999;
            }

            .reading-progress-fill {
                width: 100%;
                height: 0%;
                background: rgba(255, 255, 255, 0.35);
                transition: height 0.1s ease;
                border-radius: 0 0 2px 2px;
            }

            /* read time shown in the preface next to the date */
            .preface-read-time {
                font-family: "Inter", sans-serif;
                font-size: 12px;
                font-weight: 300;
                color: rgba(255, 255, 255, 0.2);
            }
        </style>
    </head>
    <body>
        <!-- the progress bar track sits outside the page content -->
        <div class="reading-progress-track">
            <div class="reading-progress-fill" id="progress-fill"></div>
        </div>

        <div id="topbar-container"></div>
        <script src="/nav.js"></script>

        <div class="page-content">
            <a class="back-link" href="index.html">← back to articles</a>

            <div class="post-preface">
                <span class="preface-number" id="preface-number"></span>
                <div class="preface-right">
                    <span class="preface-author" id="preface-author"></span>
                    <span class="preface-date" id="preface-date"></span>
                    <span class="preface-read-time" id="preface-read-time"></span>
                </div>
            </div>
            <hr class="preface-divider" />

            <div id="preface-tags" class="preface-tags"></div>

            <div id="post-body" class="post-body">
                <p class="status-text">loading...</p>
            </div>
        </div>

        <script>
            // update the progress bar fill as the user scrolls
            function updateProgress() {
                const body = document.getElementById("post-body");
                if (!body) return;

                // how far have we scrolled into the article specifically
                const articleTop = body.getBoundingClientRect().top + window.scrollY;
                const articleHeight = body.offsetHeight;
                const scrolled = window.scrollY - articleTop;
                const percent = Math.min(100, Math.max(0, (scrolled / articleHeight) * 100));

                document.getElementById("progress-fill").style.height = percent + "%";
            }

            window.addEventListener("scroll", updateProgress, { passive: true });

            // estimate reading time from plain text word count (avg 200 wpm)
            function estimateReadTime(markdown) {
                const words = markdown.trim().split(/\s+/).length;
                const minutes = Math.ceil(words / 200);
                return minutes === 1 ? "1 min read" : `${minutes} min read`;
            }

            async function loadPost() {
                const postBody = document.getElementById("post-body");

                const params = new URLSearchParams(window.location.search);
                const postId = params.get("post");

                if (!postId) {
                    postBody.innerHTML =
                        '<p class="status-text">no article specified.</p>';
                    return;
                }

                try {
                    const metaResponse = await fetch("posts/posts.json");
                    const allPosts = await metaResponse.json();
                    const meta = allPosts.find((p) => p.id === postId);

                    if (meta) {
                        document.getElementById("preface-number").textContent =
                            `#${meta.id}`;
                        document.getElementById("preface-author").textContent =
                            meta.author;
                        document.getElementById("preface-date").textContent =
                            meta.date;
                        document.title = `${meta.title} — Ansilian`;

                        if (meta.tags && meta.tags.length > 0) {
                            document.getElementById("preface-tags").innerHTML =
                                meta.tags
                                    .map((t) => `<span class="preface-tag">${t}</span>`)
                                    .join("");
                        }
                    }

                    const mdResponse = await fetch(`posts/${postId}.md`);

                    if (!mdResponse.ok) {
                        postBody.innerHTML =
                            '<p class="status-text">article not found.</p>';
                        return;
                    }

                    const markdown = await mdResponse.text();

                    // show read time estimate before rendering
                    document.getElementById("preface-read-time").textContent =
                        estimateReadTime(markdown);

                    const processed = markdown.replace(
                        /([^\n])\n([^\n])/g,
                        "$1  \n$2",
                    );
                    postBody.innerHTML = marked.parse(processed);

                    // run once after content loads to set initial progress
                    updateProgress();
                } catch (error) {
                    postBody.innerHTML =
                        '<p class="status-text">could not load article.</p>';
                    console.error(error);
                }
            }

            loadPost();
        </script>
    </body>
</html>
