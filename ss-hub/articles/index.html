<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Articles</title>
        <link rel="icon" type="image/png" href="/assets/ansilian.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../style.css" />
        <link rel="stylesheet" href="style.css?v=1" />
    </head>
    <body>
        <div id="topbar-container"></div>
        <script src="/nav.js"></script>

        <div class="main-layout-wrapper">

            <!-- GAP 1: sidebar filters -->
            <aside class="sidebar-filters">

                <!-- sort -->
                <div class="filter-section">
                    <button class="filter-section-toggle" onclick="toggleSection('sort')">
                        <span class="filter-arrow" id="arrow-sort">▾</span>
                        <span>sort</span>
                    </button>
                    <div class="filter-list" id="list-sort">
                        <button class="filter-item sort-btn active" id="sort-newest" onclick="setSort('newest')">newest first</button>
                        <button class="filter-item sort-btn" id="sort-oldest" onclick="setSort('oldest')">oldest first</button>
                    </div>
                </div>

                <!-- authors -->
                <div class="filter-section">
                    <button class="filter-section-toggle" onclick="toggleSection('authors')">
                        <span class="filter-arrow" id="arrow-authors">▾</span>
                        <span>authors</span>
                    </button>
                    <div class="filter-list" id="list-authors"></div>
                </div>

                <!-- tags -->
                <div class="filter-section">
                    <button class="filter-section-toggle" onclick="toggleSection('tags')">
                        <span class="filter-arrow" id="arrow-tags">▾</span>
                        <span>tags</span>
                    </button>
                    <div class="filter-list" id="list-tags"></div>
                </div>

            </aside>

            <!-- CENTER: articles -->
            <main class="page-content">
                <h1 class="page-title">articles</h1>
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="search by title, author or tag..."
                    autocomplete="off"
                />
                <div id="posts-container">
                    <p class="status-text">loading...</p>
                </div>
            </main>

            <!-- Right Sidebar Columns: Media & Videos Feed -->
            <aside class="sidebar-media">
                <h3 class="media-feed-title">
                    <span class="media-icon">▶</span> Attached Media
                </h3>
                <div id="video-feed-container" class="video-feed">
                    <!-- JavaScript will populate media cards dynamically here -->
                </div>
            </aside>
        </div>

        <script>
            let allPosts = [];
            let currentSort = "newest";
            let authorStates = new Map(); // "neutral" | "include" | "exclude"
            let tagStates    = new Map();

            // ── section collapse ──
            const sectionOpen = { sort: true, authors: true, tags: true };

            function toggleSection(key) {
                sectionOpen[key] = !sectionOpen[key];
                const list  = document.getElementById(`list-${key}`);
                const arrow = document.getElementById(`arrow-${key}`);
                list.style.display  = sectionOpen[key] ? "flex" : "none";
                arrow.classList.toggle("closed", !sectionOpen[key]);
            }

            // ── sort ──
            function setSort(dir) {
                currentSort = dir;
                document.getElementById("sort-newest").classList.toggle("active", dir === "newest");
                document.getElementById("sort-oldest").classList.toggle("active", dir === "oldest");
                renderCards();
            }

            // ── 3-state toggle factory ──
            function cycleState(map, key, el) {
                const states = ["neutral", "include", "exclude"];
                const current = map.get(key) || "neutral";
                const next = states[(states.indexOf(current) + 1) % 3];
                map.set(key, next);
                el.className = `filter-item toggle-item state-${next}`;
                if (next === "exclude") el.style.textDecoration = "line-through";
                else el.style.textDecoration = "";
                renderCards();
            }

            // ── populate sidebar ──
            function buildSidebar() {
                const authors = [...new Set(allPosts.map(p => p.author).filter(Boolean))].sort();
                const tags    = [...new Set(allPosts.flatMap(p => p.tags || []))].sort();

                const authorList = document.getElementById("list-authors");
                authorList.innerHTML = ""; // Clear existing elements before building
                authors.forEach(a => {
                    const btn = document.createElement("button");
                    btn.className = "filter-item toggle-item state-neutral";
                    btn.textContent = a;
                    btn.addEventListener("click", () => cycleState(authorStates, a, btn));
                    authorList.appendChild(btn);
                });

                const tagList = document.getElementById("list-tags");
                tagList.innerHTML = ""; // Clear existing elements before building
                tags.forEach(t => {
                    const btn = document.createElement("button");
                    btn.className = "filter-item toggle-item state-neutral";
                    btn.textContent = t;
                    btn.addEventListener("click", () => cycleState(tagStates, t, btn));
                    tagList.appendChild(btn);
                });
            }

            // ── Helper to extract YouTube IDs ──
            function getYouTubeData(url) {
                if (!url) return null;
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);

                if (match && match[2].length === 11) {
                    const videoId = match[2];
                    return {
                        id: videoId,
                        thumbnail: `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
                        embedUrl: `https://www.youtube.com/embed/${videoId}`
                    };
                }
                return null;
            }

            // ── Side Column Video Feed Renderer ──
            function renderVideoFeed(articles) {
                const feedContainer = document.getElementById('video-feed-container');
                if (!feedContainer) return;

                const mediaArticles = articles.filter(item => item.video && item.video.trim() !== "");

                if (mediaArticles.length === 0) {
                    feedContainer.innerHTML = '<p class="no-media-text">No media attached</p>';
                    return;
                }

                feedContainer.innerHTML = mediaArticles.map(item => {
                    const ytData = getYouTubeData(item.video);
                    if (!ytData) return '';

                    return `
                        <div class="video-card" data-article-id="${item.id}">
                            <div class="video-thumbnail-wrapper">
                                <img src="${ytData.thumbnail}" alt="${item.title} Video Thumbnail" class="video-thumbnail" loading="lazy">
                                <div class="play-overlay">
                                    <span class="play-triangle">▶</span>
                                </div>
                            </div>
                            <div class="video-meta">
                                <h4 class="video-card-title">${item.title}</h4>
                                <span class="video-card-author">by ${item.author}</span>
                            </div>
                        </div>
                    `;
                }).join('');

                // Link cards to viewport target positions smoothly
                feedContainer.querySelectorAll('.video-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const articleId = card.getAttribute('data-article-id');
                        const targetArticle = document.getElementById(`article-${articleId}`);
                        if (targetArticle) {
                            targetArticle.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            // Visual feedback accent flash highlight
                            targetArticle.style.borderColor = "rgba(150, 200, 255, 0.4)";
                            setTimeout(() => { targetArticle.style.borderColor = ""; }, 1000);
                        }
                    });
                });
            }

            // ── render tag badges ──
            function renderTags(tags) {
                if (!tags || tags.length === 0) return "";
                return `<div class="card-tags">${tags.map(t => `<span class="card-tag">${t}</span>`).join("")}</div>`;
            }

            // ── render primary articles feed ──
            function renderCards() {
                const container = document.getElementById("posts-container");
                const query = document.getElementById("search-input").value.toLowerCase().trim();

                const includedAuthors = [...authorStates.entries()].filter(([,v]) => v === "include").map(([k]) => k);
                const excludedAuthors = [...authorStates.entries()].filter(([,v]) => v === "exclude").map(([k]) => k);
                const includedTags    = [...tagStates.entries()].filter(([,v]) => v === "include").map(([k]) => k);
                const excludedTags    = [...tagStates.entries()].filter(([,v]) => v === "exclude").map(([k]) => k);

                let results = allPosts.filter(p => {
                    const postTags = p.tags || [];

                    const matchesSearch = !query ||
                        p.title.toLowerCase().includes(query) ||
                        p.author.toLowerCase().includes(query) ||
                        postTags.some(t => t.toLowerCase().includes(query));

                    const authorOk =
                        !excludedAuthors.includes(p.author) &&
                        (includedAuthors.length === 0 || includedAuthors.includes(p.author));

                    const tagsOk =
                        !postTags.some(t => excludedTags.includes(t)) &&
                        (includedTags.length === 0 || includedTags.every(t => postTags.includes(t)));

                    return matchesSearch && authorOk && tagsOk;
                });

                results.sort((a, b) => currentSort === "newest"
                    ? Number(b.id) - Number(a.id)
                    : Number(a.id) - Number(b.id)
                );

                container.innerHTML = "";

                if (results.length === 0) {
                    container.innerHTML = '<p class="status-text">no articles found.</p>';
                    return;
                }

                results.forEach(post => {
                    const card = document.createElement("a");
                    card.className = "post-card";
                    card.id = `article-${post.id}`; // CRITICAL: Added ID targeting attribute hook here
                    card.href = `reader.html?post=${post.id}`;
                    card.innerHTML = `
                        <div class="card-top-row">
                            <span class="card-number">#${post.id}</span>
                            <span class="card-dot">·</span>
                            <span class="card-date">${post.date}</span>
                        </div>
                        <div class="card-title">${post.title}</div>
                        ${post.description ? `<div class="card-desc">${post.description}</div>` : ""}
                        <div class="card-bottom-row">
                            <span class="card-author">${post.author}</span>
                            ${renderTags(post.tags)}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            // ── initialize database load ──
            async function loadPosts() {
                const container = document.getElementById("posts-container");
                try {
                    const response = await fetch("posts/posts.json");
                    allPosts = await response.json();

                    if (allPosts.length === 0) {
                        container.innerHTML = '<p class="status-text">nothing here yet.</p>';
                        return;
                    }

                    buildSidebar();
                    renderCards();
                    renderVideoFeed(allPosts); // Renders complete video listings on dynamic boot up

                    document.getElementById("search-input").addEventListener("input", renderCards);
                } catch (error) {
                    container.innerHTML = '<p class="status-text">could not load articles.</p>';
                    console.error(error);
                }
            }

            loadPosts();
        </script>
    </body>
</html>
