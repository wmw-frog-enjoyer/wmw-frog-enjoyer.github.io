<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>customs</title>
        <link rel="icon" type="image/png" href="/assets/ansilian.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../../style.css" />
        <link rel="stylesheet" href="style.css?v=1" />
    </head>
    <body>
        <div id="topbar-container"></div>
        <script src="/nav.js"></script>

        <div class="page-content">
            <h1 class="page-title" style="margin-bottom: 24px;">customs</h1>

            <div class="pattern-filter" id="pattern-filter">
                <span class="pattern-filter-label">patterns</span>
                <div class="pattern-pills" id="pattern-pills"></div>
            </div>

            <!-- Balanced layout wrapper matching the search padding -->
            <div style="display: flex; gap: 12px; margin-bottom: 8px;">
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="search by name, mapper, archiver, id, or pattern..."
                    autocomplete="off"
                    style="margin-bottom: 0; flex: 1;"
                />
                <button id="random-btn" class="action-btn" style="width: auto; padding: 14px 24px; white-space: nowrap; height: 100%; box-sizing: border-box;">Random Map</button>
            </div>

            <!-- Total map count placed perfectly underneath the search zone -->
            <div style="margin-bottom: 20px; padding-left: 4px;">
                <span id="map-counter" class="status-text" style="font-size: 14px; font-weight: 400; color: rgba(255, 255, 255, 0.4);"></span>
            </div>

            <div id="customs-container">
                <p class="status-text">loading...</p>
            </div>
        </div>

        <script>
            let allCustoms = [];
            let patternStates = new Map();

            // Muted, low-saturation palette for clean system scanning
            const ratingColors = {
                's---': { text: '#4a6fa5', bg: 'rgba(74, 111, 165, 0.1)',  border: 'rgba(74, 111, 165, 0.2)' },
                's--':  { text: '#63b3ed', bg: 'rgba(99, 179, 237, 0.1)',  border: 'rgba(99, 179, 237, 0.2)' },
                's-':   { text: '#90cdf4', bg: 'rgba(144, 205, 244, 0.1)', border: 'rgba(144, 205, 244, 0.2)' },
                'nm':   { text: '#ffffff', bg: 'rgba(255, 255, 255, 0.06)', border: 'rgba(255, 255, 255, 0.15)' },
                's+':   { text: '#81e6d9', bg: 'rgba(129, 230, 217, 0.1)', border: 'rgba(129, 230, 217, 0.2)' },
                's++':  { text: '#faf089', bg: 'rgba(250, 240, 137, 0.08)', border: 'rgba(250, 240, 137, 0.18)' },
                's+++': { text: '#feb2b2', bg: 'rgba(254, 178, 178, 0.08)', border: 'rgba(254, 178, 178, 0.18)' },
                'default': { text: 'rgba(255, 255, 255, 0.8)', bg: 'rgba(255, 255, 255, 0.04)', border: 'rgba(255, 255, 255, 0.1)' }
            };

            function getRatingStyle(rating) {
                if (!rating) return ratingColors.default;
                const normalized = rating.toLowerCase().trim();
                return ratingColors[normalized] || ratingColors.default;
            }

            async function copyLink(link, btn) {
                try {
                    await navigator.clipboard.writeText(link);
                    const original = btn.textContent;

                    btn.textContent = "copied!";
                    btn.classList.add("copied");

                    setTimeout(() => {
                        btn.textContent = original;
                        btn.classList.remove("copied");
                    }, 2000);
                } catch {
                    btn.textContent = "copy failed";
                    setTimeout(() => (btn.textContent = "copy link"), 2000);
                }
            }

            function buildPatternPills(customs) {
                const patterns = [
                    ...new Set(
                        customs.flatMap((c) => c.pattern).filter(Boolean),
                    ),
                ].sort();
                const pillsContainer = document.getElementById("pattern-pills");

                pillsContainer.innerHTML = patterns
                    .map(
                        (p) => `
                    <button class="pattern-pill" data-pattern="${p}" onclick="togglePattern('${p}', this)">
                        ${p}
                    </button>
                `,
                    )
                    .join("");
            }

            function togglePattern(pattern, btn) {
                const current = patternStates.get(pattern) || 0;
                const next = (current + 1) % 3;
                patternStates.set(pattern, next);

                btn.classList.remove("include", "exclude");
                if (next === 1) btn.classList.add("include");
                if (next === 2) btn.classList.add("exclude");

                renderCards(document.getElementById("search-input").value);
            }

            function buildCard(custom) {
                const patternsArray = Array.isArray(custom.pattern)
                    ? custom.pattern
                    : custom.pattern
                      ? [custom.pattern]
                      : [];

                const badgesHtml = patternsArray
                    .map((p) => `<span class="pattern-badge">${p}</span>`)
                    .join("");

                const colors = getRatingStyle(custom.rating);

                return `
                    <div class="custom-card">
                        <div class="card-top-row">
                            <span class="card-number">#${custom.id}</span>
                            <span class="card-dot">·</span>
                            <span class="card-date">${custom.date}</span>
                            ${badgesHtml}
                        </div>
                        <div class="card-name">${custom.name}</div>
                        <div class="card-mapper">mapped by ${custom.mapper}</div>
                        <div class="card-meta-row">
                            <span class="card-rating rating-badge" style="color: ${colors.text}; background: ${colors.bg}; border: 1px solid ${colors.border}; padding: 3px 8px; border-radius: 5px; font-weight: 400; font-size: 13px;">⬦ ${custom.rating}</span>
                            <span class="card-archiver">archived by ${custom.archiver}</span>
                        </div>
                        <button class="action-btn" onclick="copyLink('${custom.link}', this)">copy link</button>
                    </div>
                `;
            }

            function renderCards(filter) {
                const container = document.getElementById("customs-container");
                const counterDisplay = document.getElementById("map-counter");
                const query = filter.toLowerCase().trim();

                const included = [...patternStates.entries()]
                    .filter(([, v]) => v === 1)
                    .map(([k]) => k);
                const excluded = [...patternStates.entries()]
                    .filter(([, v]) => v === 2)
                    .map(([k]) => k);

                const results = allCustoms.filter((c) => {
                    const currentPatterns = Array.isArray(c.pattern)
                        ? c.pattern
                        : c.pattern
                          ? [c.pattern]
                          : [];

                    const matchesSearch =
                        !query ||
                        c.name.toLowerCase().includes(query) ||
                        c.mapper.toLowerCase().includes(query) ||
                        c.archiver.toLowerCase().includes(query) ||
                        c.id.includes(query) ||
                        currentPatterns.some((p) =>
                            p.toLowerCase().includes(query),
                        );

                    const notExcluded = !currentPatterns.some((p) =>
                        excluded.includes(p),
                    );

                    const matchesInclude =
                        included.length === 0 ||
                        included.every((p) => currentPatterns.includes(p));

                    return matchesSearch && notExcluded && matchesInclude;
                });

                if (allCustoms.length === results.length) {
                    counterDisplay.textContent = `${allCustoms.length} total maps`;
                } else {
                    counterDisplay.textContent = `showing ${results.length} of ${allCustoms.length} maps`;
                }

                if (results.length === 0) {
                    container.innerHTML =
                        '<p class="status-text">no customs found.</p>';
                    return;
                }

                container.innerHTML = results.map(buildCard).join("");
            }

            function pickRandomMap() {
                if (allCustoms.length === 0) return;

                const randomIndex = Math.floor(Math.random() * allCustoms.length);
                const selectedMap = allCustoms[randomIndex];

                const searchInput = document.getElementById("search-input");

                patternStates.clear();
                document.querySelectorAll('.pattern-pill').forEach(btn => {
                    btn.classList.remove('include', 'exclude');
                });

                searchInput.value = selectedMap.id;
                searchInput.dispatchEvent(new Event('input'));
                searchInput.focus();
            }

            async function loadCustoms() {
                const container = document.getElementById("customs-container");
                try {
                    const response = await fetch("customs.json");
                    allCustoms = await response.json();

                    if (allCustoms.length === 0) {
                        container.innerHTML =
                            '<p class="status-text">nothing here yet.</p>';
                        document.getElementById("map-counter").textContent = "0 total maps";
                        return;
                    }

                    allCustoms.sort((a, b) => Number(b.id) - Number(a.id));

                    buildPatternPills(allCustoms);
                    renderCards("");

                    document
                        .getElementById("search-input")
                        .addEventListener("input", (e) => {
                            renderCards(e.target.value);
                        });

                    document.getElementById("random-btn").addEventListener("click", pickRandomMap);
                } catch (error) {
                    container.innerHTML =
                        '<p class="status-text">could not load customs.</p>';
                    console.error(error);
                }
            }

            loadCustoms();
        </script>
    </body>
</html>
