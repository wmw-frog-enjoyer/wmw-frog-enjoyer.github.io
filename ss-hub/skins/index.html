    <body>
        <div data-component="navbar"></div>
        <script src="/js/utils.js"></script>
        <script src="/js/components.js"></script>
        <script src="/js/nav.js"></script>

        <main id="main-content" class="page-content">
            <h1 class="page-title">Skins</h1>

            <!-- type toggle pills -->
            <div class="type-filter">
                <span class="type-filter-label">type</span>
                <div class="type-pills" id="type-pills"></div>
            </div>

            <label class="sr-only" id="skins-search-label" for="search-input">Search skins by title, author, type, or tag</label>
            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="search by title, author, type or tag..."
                autocomplete="off"
            />
            <div id="skins-container" aria-live="polite">
                <p class="status-text">loading...</p>
            </div>
        </main>

        <script>
            let allSkins = [];
            let typeStates = new Map(); // type → 0 (neutral), 1 (include), 2 (exclude)

            const TYPE_LABELS = {
                "ss-skin": "ss skin",
                "ss-cursor": "ss cursor",
                "ssp-cursor": "ssp cursor",
                "ssp-hit": "ssp hit",
                "ssp-miss": "ssp miss",
                "ssp-mesh": "ssp mesh",
            };

            function getYouTubeEmbedUrl(url) {
                return window.AnsilianUtils.getYouTubeData(url)?.embedUrl || null;
            }

            async function copyFile(path, btn) {
                try {
                    const response = await fetch(path);

                    if (!response.ok) {
                        throw new Error(`Failed to fetch ${path}: ${response.status}`);
                    }

                    const text = await response.text();
                    const success = await AnsilianUtils.copyText(text);

                    if (!success) {
                        throw new Error("Clipboard copy failed");
                    }

                    const original = btn.textContent;
                    btn.textContent = "copied!";

                    setTimeout(() => {
                        btn.textContent = original;
                    }, 2000);
                } catch (error) {
                    console.error("Could not copy skin:", error);

                    btn.textContent = "copy failed";

                    setTimeout(() => {
                        btn.textContent = "copy";
                    }, 2000);
                }
            }

            async function copyText(text, btn) {
                const success = await AnsilianUtils.copyText(text);
                const original = btn.textContent;

                if (success) {
                    btn.textContent = "copied!";

                    setTimeout(() => {
                        btn.textContent = original;
                    }, 2000);
                } else {
                    btn.textContent = "copy failed";

                    setTimeout(() => {
                        btn.textContent = "copy";
                    }, 2000);
                }
            }

            function downloadFile(path, filename) {
                const success = AnsilianUtils.downloadFile(path, filename);

                if (!success) {
                    console.error("Could not start download:", path);
                }
            }

            function getExt(filename) {
                return filename.split(".").pop();
            }

            function getPreviewImage(file) {
                const previewMap = {
                    "002.png": { src: "002.webp", width: 150, height: 150 },
                    "003.png": { src: "003.webp", width: 150, height: 150 },
                    "006.png": { src: "006-preview.webp", width: 512, height: 512 },
                    "007.png": { src: "007-preview.webp", width: 512, height: 512 },
                    "008.png": { src: "008-preview.webp", width: 512, height: 512 },
                };
                return previewMap[file] || { src: file, width: "", height: "" };
            }

            function buildTypePills(skins) {
                const types = [...new Set(skins.map((s) => s.type))].sort();
                const container = document.getElementById("type-pills");

                container.innerHTML = types
                    .map(
                        (t) => `
                    <button type="button" class="type-pill" data-type="${t}" aria-pressed="false" onclick="toggleType('${t}', this)">
                        ${TYPE_LABELS[t] || t}
                    </button>
                `,
                    )
                    .join("");
            }

            function toggleType(type, btn) {
                const current = typeStates.get(type) || 0;
                const next = (current + 1) % 3;
                typeStates.set(type, next);

                btn.classList.remove("include", "exclude");
                if (next === 1) btn.classList.add("include");
                if (next === 2) btn.classList.add("exclude");
                btn.setAttribute("aria-pressed", String(next !== 0));

                renderCards(document.getElementById("search-input").value);
            }

            function buildCard(skin) {
                const label = TYPE_LABELS[skin.type] || skin.type;
                const tags =
                    skin.tags && skin.tags.length
                        ? skin.tags
                              .map((t) => `<span class="card-tag">${t}</span>`)
                              .join("")
                        : "";

                let preview = "";
                if (skin.type === "ss-skin") {
                    const embedUrl = getYouTubeEmbedUrl(skin.video);
                    if (embedUrl) {
                        preview = `
                            <div class="video-container">
                                <iframe src="${embedUrl}" frameborder="0" loading="lazy"
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                    allowfullscreen></iframe>
                            </div>`;
                    }
                } else if (skin.type === "ss-cursor") {
                    const previewImage = getPreviewImage(skin.file);
                    preview = `
                        <img class="asset-preview" src="assets/${previewImage.src}" width="${previewImage.width}" height="${previewImage.height}" loading="lazy" decoding="async" alt="${skin.title}" />
                        <div class="cursor-code">${skin.code}</div>`;
                } else if (skin.type === "ssp-cursor") {
                    const previewImage = getPreviewImage(skin.file);
                    preview = `<img class="asset-preview" src="assets/${previewImage.src}" width="${previewImage.width}" height="${previewImage.height}" loading="lazy" decoding="async" alt="${skin.title}" />`;
                } else if (
                    skin.type === "ssp-hit" ||
                    skin.type === "ssp-miss"
                ) {
                    preview = `<audio class="audio-player" controls src="assets/${skin.file}"></audio>`;
                } else if (skin.type === "ssp-mesh") {
                    preview = `<div class="mesh-preview" data-file="assets/${skin.file}"><span class="mesh-loading">loading colors...</span></div>`;
                }

                let action = "";
                if (skin.type === "ss-skin") {
                    action = `<button type="button" class="action-btn" onclick="copyFile('assets/${skin.id}.json', this)">copy skin</button>`;
                } else if (skin.type === "ss-cursor") {
                    action = `<button type="button" class="action-btn" onclick="copyText('${skin.code}', this)">copy cursor</button>`;
                } else {
                    const filename = `${skin.title}.${getExt(skin.file)}`;
                    action = `<button type="button" class="action-btn" onclick="downloadFile('assets/${skin.file}', '${filename}')">download</button>`;
                }

                return `
                    <article class="skin-card">
                        <div class="card-top-row">
                            <span class="card-number">#${skin.id}</span>
                            <span class="card-dot">·</span>
                            <span class="card-date">${skin.date}</span>
                            <span class="type-badge type-${skin.type}">${label}</span>
                        </div>
                        <div class="card-title">${skin.title}</div>
                        <div class="card-author-row">${skin.author}</div>
                        ${preview ? `<div class="asset-preview-wrap">${preview}</div>` : ""}
                        <div class="card-action-row">
                            ${action}
                            ${tags ? `<div class="card-tags">${tags}</div>` : ""}
                        </div>
                    </article>
                `;
            }

            async function loadMeshPreviews() {
                document
                    .querySelectorAll(".mesh-preview[data-file]")
                    .forEach(async (el) => {
                        try {
                            const response = await fetch(el.dataset.file);
                            if (!response.ok) {
                                el.innerHTML =
                                    '<span class="mesh-loading">file not found</span>';
                                return;
                            }
                            const text = await response.text();
                            const matches =
                                text.match(/#[0-9a-fA-F]{6}/gi) || [];
                            const hexes = [
                                ...new Set(matches.map((h) => h.toUpperCase())),
                            ];
                            if (hexes.length === 0) {
                                el.innerHTML =
                                    '<span class="mesh-loading">no colors found</span>';
                                return;
                            }
                            el.innerHTML = hexes
                                .map(
                                    (h) =>
                                        `<div class="color-swatch" style="background:${h};" title="${h}"></div>`,
                                )
                                .join("");
                        } catch {
                            el.innerHTML =
                                '<span class="mesh-loading">could not load colors</span>';
                        }
                    });
            }

            function renderCards(filter) {
                const container = document.getElementById("skins-container");
                const query = filter.toLowerCase().trim();

                const included = [...typeStates.entries()]
                    .filter(([, v]) => v === 1)
                    .map(([k]) => k);
                const excluded = [...typeStates.entries()]
                    .filter(([, v]) => v === 2)
                    .map(([k]) => k);

                const results = allSkins.filter((s) => {
                    const matchesSearch =
                        !query ||
                        s.title.toLowerCase().includes(query) ||
                        s.author.toLowerCase().includes(query) ||
                        s.type.toLowerCase().includes(query) ||
                        (s.tags &&
                            s.tags.some((t) =>
                                t.toLowerCase().includes(query),
                            ));
                    const notExcluded = !excluded.includes(s.type);
                    const matchesInclude =
                        included.length === 0 || included.includes(s.type);
                    return matchesSearch && notExcluded && matchesInclude;
                });

                if (results.length === 0) {
                    container.innerHTML =
                        '<p class="status-text">no skins found.</p>';
                    return;
                }

                container.innerHTML = results.map(buildCard).join("");
                loadMeshPreviews();
            }

            async function loadSkins() {
                const container = document.getElementById("skins-container");
                try {
                    const response = await fetch("assets/index.json");
                    allSkins = await response.json();

                    if (allSkins.length === 0) {
                        container.innerHTML =
                            '<p class="status-text">nothing here yet.</p>';
                        return;
                    }

                    allSkins.sort((a, b) => Number(b.id) - Number(a.id));
                    buildTypePills(allSkins);
                    renderCards("");

                    document
                        .getElementById("search-input")
                        .addEventListener("input", (e) => {
                            renderCards(e.target.value);
                        });
                } catch (error) {
                    container.innerHTML =
                        '<p class="status-text">could not load skins.</p>';
                    console.error(error);
                }
            }

            loadSkins();
        </script>
        <div data-component="footer"></div>
    </body>
</html>
