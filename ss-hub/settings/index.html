<body>
    <div data-component="navbar"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/search.js"></script>

    <main id="main-content" class="page-content">
        <h1 class="page-title">settings</h1>

        <div class="type-filter" id="format-filter">
            <span class="type-filter-label">formats</span>
            <div class="type-pills" id="format-pills"></div>
        </div>

        <label
            class="sr-only"
            id="settings-search-label"
            for="search-input"
        >
            Search settings by title, author, format, or tag
        </label>

        <input
            type="text"
            id="search-input"
            class="search-input"
            aria-labelledby="settings-search-label"
            placeholder="search by title, author, format or tag..."
            autocomplete="off"
        />

        <div id="configs-container" aria-live="polite">
            <p class="status-text">loading...</p>
        </div>
    </main>

    <script>
        let allConfigs = [];
        const formatStates =
            window.AnsilianSearch.createToggleStateMap();

        function buildFormatPills(configs) {
            const formats = [
                ...new Set(
                    configs
                        .map((config) => config.format)
                        .filter(Boolean),
                ),
            ].sort();

            const pillsContainer =
                document.getElementById("format-pills");

            pillsContainer.innerHTML = formats
                .map(
                    (format) => `
                        <button
                            type="button"
                            class="type-pill"
                            data-format="${format}"
                            aria-pressed="false"
                            onclick="toggleFormat('${format}', this)"
                        >
                            ${format}
                        </button>
                    `,
                )
                .join("");
        }

        function toggleFormat(format, button) {
            const state =
                window.AnsilianSearch.cycleThreeState(
                    formatStates,
                    format,
                );

            button.classList.remove(
                "include",
                "exclude",
            );

            if (state === "include") {
                button.classList.add("include");
            }

            if (state === "exclude") {
                button.classList.add("exclude");
            }

            button.setAttribute(
                "aria-pressed",
                String(state !== "neutral"),
            );

            renderCards(
                document.getElementById("search-input").value,
            );
        }

        async function renderCards(filter) {
            const container =
                document.getElementById("configs-container");

            const query = filter.toLowerCase().trim();

            const included =
                window.AnsilianSearch.selectedKeys(
                    formatStates,
                    "include",
                );

            const excluded =
                window.AnsilianSearch.selectedKeys(
                    formatStates,
                    "exclude",
                );

            const results = allConfigs.filter((config) => {
                const matchesSearch =
                    !query ||
                    (config.title &&
                        config.title
                            .toLowerCase()
                            .includes(query)) ||
                    config.author
                        .toLowerCase()
                        .includes(query) ||
                    config.format
                        .toLowerCase()
                        .includes(query) ||
                    (config.tags &&
                        config.tags.some((tag) =>
                            tag
                                .toLowerCase()
                                .includes(query),
                        ));

                const notExcluded =
                    !excluded.includes(config.format);

                const matchesInclude =
                    included.length === 0 ||
                    included.includes(config.format);

                return (
                    matchesSearch &&
                    notExcluded &&
                    matchesInclude
                );
            });

            container.innerHTML = "";

            if (results.length === 0) {
                container.innerHTML =
                    '<p class="status-text">no configs found.</p>';
                return;
            }

            const cards = await Promise.all(
                results.map((config) =>
                    window.renderComponent(
                        "article-card",
                        {
                            idAttr: `config-${config.id}`,
                            href: `reader.html?config=${config.id}`,
                            number: config.id,
                            date: config.date,
                            title:
                                config.title ||
                                config.author,
                            metaHtml: `
                                <span class="format-badge format-${config.format}">
                                    ${config.format}
                                </span>
                            `,
                            descriptionHtml: "",
                            authorHtml: `
                                <div class="card-author-row">
                                    ${config.author}
                                </div>
                            `,
                            bottomHtml: `
                                <div class="card-tags">
                                    ${window.AnsilianUtils.renderTags(
                                        config.tags,
                                    )}
                                </div>
                            `,
                        },
                    ),
                ),
            );

            container.innerHTML = cards.join("");
        }

        async function loadConfigs() {
            const container =
                document.getElementById("configs-container");

            try {
                const response = await fetch(
                    "configs/index.json",
                );

                allConfigs = await response.json();

                if (allConfigs.length === 0) {
                    container.innerHTML =
                        '<p class="status-text">nothing here yet.</p>';
                    return;
                }

                allConfigs.sort(
                    (a, b) =>
                        Number(b.id) - Number(a.id),
                );

                buildFormatPills(allConfigs);
                renderCards("");

                document
                    .getElementById("search-input")
                    .addEventListener(
                        "input",
                        (event) => {
                            renderCards(
                                event.target.value,
                            );
                        },
                    );
            } catch (error) {
                container.innerHTML =
                    '<p class="status-text">could not load configs.</p>';

                console.error(error);
            }
        }

        loadConfigs();
    </script>

    <div data-component="footer"></div>
</body>
</html>
