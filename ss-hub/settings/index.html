    <main id="main-content" class="page-content">
        <h1 class="page-title">settings</h1>

        <div class="format-filter" id="format-filter">
            <span class="format-filter-label">formats</span>
            <div class="format-pills" id="format-pills"></div>
        </div>

        <label
            class="sr-only"
            id="settings-search-label"
            for="search-input"
        >
            Search settings by title, author, format, or tag
        </label>

        <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="search by title, author, format or tag..."
            autocomplete="off"
        />

        <div id="configs-container" aria-live="polite">
            <p class="status-text">loading...</p>
        </div>
    </main>

    <script>
        let allConfigs = [];
        let formatStates = new Map();

        function buildFormatPills(configs) {
            const formats = [
                ...new Set(
                    configs
                        .map((config) => config.format)
                        .filter(Boolean),
                ),
            ].sort();

            const pillsContainer =
                document.getElementById("format-pills");

            pillsContainer.innerHTML = formats
                .map(
                    (format) => `
                <button
                    type="button"
                    class="format-pill format-${format}"
                    data-format="${format}"
                    aria-pressed="false"
                    onclick="toggleFormat('${format}', this)"
                >
                    ${format}
                </button>
            `,
                )
                .join("");
        }

        function toggleFormat(format, btn) {
            const current = formatStates.get(format) || 0;
            const next = (current + 1) % 3;

            formatStates.set(format, next);

            btn.classList.remove("include", "exclude");

            if (next === 1) {
                btn.classList.add("include");
            }

            if (next === 2) {
                btn.classList.add("exclude");
            }

            btn.setAttribute(
                "aria-pressed",
                String(next !== 0),
            );

            renderCards(
                document.getElementById("search-input").value,
            );
        }

        async function renderCards(filter) {
            const container =
                document.getElementById("configs-container");

            const query = filter.toLowerCase().trim();

            const included = [...formatStates.entries()]
                .filter(([, state]) => state === 1)
                .map(([format]) => format);

            const excluded = [...formatStates.entries()]
                .filter(([, state]) => state === 2)
                .map(([format]) => format);

            const results = allConfigs.filter((config) => {
                const matchesSearch =
                    !query ||
                    (config.title &&
                        config.title
                            .toLowerCase()
                            .includes(query)) ||
                    config.author
                        .toLowerCase()
                        .includes(query) ||
                    config.format
                        .toLowerCase()
                        .includes(query) ||
                    (config.tags &&
                        config.tags.some((tag) =>
                            tag.toLowerCase().includes(query),
                        ));

                const notExcluded = !excluded.includes(
                    config.format,
                );

                const matchesInclude =
                    included.length === 0 ||
                    included.includes(config.format);

                return (
                    matchesSearch &&
                    notExcluded &&
                    matchesInclude
                );
            });

            container.innerHTML = "";

            if (results.length === 0) {
                container.innerHTML =
                    '<p class="status-text">no configs found.</p>';
                return;
            }

            const cards = await Promise.all(
                results.map((config) =>
                    window.renderComponent("article-card", {
                        idAttr: `config-${config.id}`,
                        href: `reader.html?config=${config.id}`,
                        number: config.id,
                        date: config.date,
                        title:
                            config.title || config.author,
                        metaHtml: `<span class="format-badge format-${config.format}">${config.format}</span>`,
                        descriptionHtml: "",
                        authorHtml: `<div class="card-author-row">${config.author}</div>`,
                        bottomHtml: `<div class="card-tags">${window.AnsilianUtils.renderTags(config.tags)}</div>`,
                    }),
                ),
            );

            container.innerHTML = cards.join("");
        }

        async function loadConfigs() {
            const container =
                document.getElementById("configs-container");

            try {
                const response = await fetch(
                    "configs/index.json",
                );

                allConfigs = await response.json();

                if (allConfigs.length === 0) {
                    container.innerHTML =
                        '<p class="status-text">nothing here yet.</p>';
                    return;
                }

                allConfigs.sort(
                    (a, b) =>
                        Number(b.id) - Number(a.id),
                );

                buildFormatPills(allConfigs);
                renderCards("");

                document
                    .getElementById("search-input")
                    .addEventListener(
                        "input",
                        (e) => {
                            renderCards(e.target.value);
                        },
                    );
            } catch (error) {
                container.innerHTML =
                    '<p class="status-text">could not load configs.</p>';

                console.error(error);
            }
        }

        loadConfigs();
    </script>

    <div data-component="footer"></div>
</body>
