        content="Search archived Sound Space and Sound Space Plus settings by author, format, title, and tag."
    />
    <meta property="og:type" content="website" />
    <meta

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "CollectionPage",
            "name": "Sound Space Settings | Ansilian",
            "description": "Search archived Sound Space and Sound Space Plus settings by author, format, title, and tag.",
            "url": "https://wmw-frog-enjoyer.github.io/ss-hub/settings/",
            "image": "https://wmw-frog-enjoyer.github.io/assets/ansilian.webp",
            "isPartOf": {
                "@type": "WebSite",
                "name": "Ansilian",
                "url": "https://wmw-frog-enjoyer.github.io/"
            }
        }
    </script>

    <link rel="icon" type="image/png" href="/assets/ansilian.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,100..900&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
        rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css?v=1" />
</head>

<body>
    <div data-component="navbar"></div>

    <script src="/js/utils.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/search.js"></script>

    <main id="main-content" class="page-content">
        <h1 class="page-title">settings</h1>

        <div class="type-filter" id="format-filter">
            <span class="type-filter-label">formats</span>
            <div class="type-pills" id="format-pills"></div>
        </div>

        <label
            class="sr-only"
            id="settings-search-label"
            for="search-input"
        >
            Search settings by title, author, format, or tag
        </label>

        <input
            type="text"
            id="search-input"
            class="search-input"
            aria-labelledby="settings-search-label"
            placeholder="search by title, author, format or tag..."
            autocomplete="off"
        />

        <div id="configs-container" aria-live="polite">
            <p class="status-text">loading...</p>
        </div>
    </main>

    <script>
        let allConfigs = [];

        const formatStates =
            window.AnsilianSearch.createToggleStateMap();

        const SS_FIELDS = [
            {
                key: "ApproachRate",
                label: "Approach Rate",
            },
            {
                key: "ApproachDistance",
                label: "Approach Distance",
            },
            {
                key: "FadeInLength",
                label: "Fade In Length",
            },
            {
                key: "Parallax",
                label: "Camera Parallax",
            },
        ];

        const SSP_FIELDS = [
            {
                key: "approach_rate",
                label: "Approach Rate",
            },
            {
                key: "spawn_distance",
                label: "Spawn Distance",
            },
            {
                key: "fade_length",
                label: "Fade In Length",
            },
            {
                key: "parallax",
                label: "Parallax",
            },
            {
                key: "grid_parallax",
                label: "Grid Parallax",
            },
            {
                key: "ui_parallax",
                label: "UI Parallax",
            },
        ];

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value ?? "";
            return div.innerHTML;
        }

        function getYouTubeEmbedUrl(url) {
            return (
                window.AnsilianUtils.getYouTubeData(url)?.embedUrl ||
                null
            );
        }

        function buildFormatPills(configs) {
            const formats = [
                ...new Set(
                    configs
                        .map((config) => config.format)
                        .filter(Boolean),
                ),
            ].sort();

            const pillsContainer =
                document.getElementById("format-pills");

            pillsContainer.innerHTML = formats
                .map(
                    (format) => `
                        <button
                            type="button"
                            class="type-pill"
                            data-format="${escapeHtml(format)}"
                            aria-pressed="false"
                            onclick="toggleFormat('${escapeHtml(format)}', this)"
                        >
                            ${escapeHtml(format)}
                        </button>
                    `,
                )
                .join("");
        }

        function toggleFormat(format, button) {
            const state =
                window.AnsilianSearch.cycleThreeState(
                    formatStates,
                    format,
                );

            button.classList.remove(
                "include",
                "exclude",
            );

            if (state === "include") {
                button.classList.add("include");
            }

            if (state === "exclude") {
                button.classList.add("exclude");
            }

            button.setAttribute(
                "aria-pressed",
                String(state !== "neutral"),
            );

            renderCards(
                document.getElementById("search-input").value,
            );
        }

        function renderStats(configData, format) {
            const fields =
                format === "ssp"
                    ? SSP_FIELDS
                    : SS_FIELDS;

            return fields
                .map(({ key, label }) => {
                    const value = configData[key];

                    if (
                        value === undefined ||
                        value === null
                    ) {
                        return "";
                    }

                    return `
                        <div class="stat-box">
                            <div class="stat-label">
                                ${escapeHtml(label)}
                            </div>
                            <div class="stat-value">
                                ${escapeHtml(String(value))}
                            </div>
                        </div>
                    `;
                })
                .join("");
        }

        function renderVideo(videoUrl) {
            if (!videoUrl) {
                return "";
            }

            const embedUrl =
                getYouTubeEmbedUrl(videoUrl);

            if (!embedUrl) {
                return "";
            }

            return `
                <div class="video-container">
                    <iframe
                        class="video-embed"
                        src="${escapeHtml(embedUrl)}"
                        frameborder="0"
                        loading="lazy"
                        allow="
                            accelerometer;
                            autoplay;
                            clipboard-write;
                            encrypted-media;
                            gyroscope;
                            picture-in-picture;
                        "
                        allowfullscreen
                    ></iframe>
                </div>
            `;
        }

        function addCopyButton(button, configData) {
            button.addEventListener("click", () => {
                navigator.clipboard
                    .writeText(
                        JSON.stringify(
                            configData,
                            null,
                            2,
                        ),
                    )
                    .then(() => {
                        button.textContent =
                            "copied!";

                        setTimeout(() => {
                            button.textContent =
                                "copy config";
                        }, 2000);
                    })
                    .catch(() => {
                        button.textContent =
                            "copy failed";

                        setTimeout(() => {
                            button.textContent =
                                "copy config";
                        }, 2000);
                    });
            });
        }

        function addDownloadButton(
            button,
            configData,
            author,
        ) {
            button.addEventListener("click", () => {
                const blob = new Blob(
                    [
                        JSON.stringify(
                            configData,
                            null,
                            2,
                        ),
                    ],
                    {
                        type: "application/json",
                    },
                );

                const url =
                    URL.createObjectURL(blob);

                const anchor =
                    document.createElement("a");

                anchor.href = url;
                anchor.download = `${author}-ssp-settings.json`;
                anchor.click();

                URL.revokeObjectURL(url);
            });
        }

        async function renderConfig(config) {
            try {
                const response = await fetch(
                    `configs/${config.id}.json`,
                );

                if (!response.ok) {
                    return `
                        <p class="status-text">
                            settings file not found.
                        </p>
                    `;
                }

                const configData =
                    await response.json();

                const actionLabel =
                    config.format === "ss"
                        ? "copy config"
                        : "download config";

                const actionButton = `
                    <button
                        type="button"
                        class="action-btn"
                        data-action="config"
                    >
                        ${actionLabel}
                    </button>
                `;

                const card = await window.renderComponent(
                    "article-card",
                    {
                        idAttr: `config-${config.id}`,
                        href: "#",
                        number: config.id,
                        date: config.date,
                        title:
                            config.title ||
                            config.author,
                        metaHtml: `
                            <span class="format-badge format-${escapeHtml(config.format)}">
                                ${escapeHtml(config.format)}
                            </span>
                        `,
                        descriptionHtml: `
                            <div class="settings-card-content">
                                <div class="post-preface">
                                    <div class="preface-left">
                                        <span class="preface-number">
                                            #${escapeHtml(config.id)}
                                        </span>

                                        <span class="format-badge format-${escapeHtml(config.format)}">
                                            ${escapeHtml(config.format)}
                                        </span>
                                    </div>

                                    <div class="preface-right">
                                        <span class="preface-author">
                                            ${escapeHtml(config.author)}
                                        </span>

                                        <span class="preface-date">
                                            ${escapeHtml(config.date)}
                                        </span>
                                    </div>
                                </div>

                                <hr class="preface-divider" />

                                <div class="preface-tags">
                                    ${window.AnsilianUtils.renderTags(
                                        config.tags,
                                    )}
                                </div>

                                <div class="stats-grid">
                                    ${renderStats(
                                        configData,
                                        config.format,
                                    )}
                                </div>

                                ${renderVideo(
                                    config.video,
                                )}

                                <div class="action-container">
                                    ${actionButton}
                                </div>
                            </div>
                        `,
                        authorHtml: "",
                        bottomHtml: "",
                    },
                );

                const wrapper =
                    document.createElement("div");

                wrapper.innerHTML = card;

                const actionButtonElement =
                    wrapper.querySelector(
                        '[data-action="config"]',
                    );

                if (
                    actionButtonElement &&
                    config.format === "ss"
                ) {
                    addCopyButton(
                        actionButtonElement,
                        configData,
                    );
                }

                if (
                    actionButtonElement &&
                    config.format === "ssp"
                ) {
                    addDownloadButton(
                        actionButtonElement,
                        configData,
                        config.author,
                    );
                }

                return wrapper.innerHTML;
            } catch (error) {
                console.error(
                    `Could not load config ${config.id}:`,
                    error,
                );

                return `
                    <p class="status-text">
                        could not load config.
                    </p>
                `;
            }
        }

        async function renderCards(filter) {
            const container =
                document.getElementById(
                    "configs-container",
                );

            const query =
                filter.toLowerCase().trim();

            const included =
                window.AnsilianSearch.selectedKeys(
                    formatStates,
                    "include",
                );

            const excluded =
                window.AnsilianSearch.selectedKeys(
                    formatStates,
                    "exclude",
                );

            const results = allConfigs.filter(
                (config) => {
                    const matchesSearch =
                        !query ||
                        (config.title &&
                            config.title
                                .toLowerCase()
                                .includes(query)) ||
                        config.author
                            .toLowerCase()
                            .includes(query) ||
                        config.format
                            .toLowerCase()
                            .includes(query) ||
                        (config.tags &&
                            config.tags.some(
                                (tag) =>
                                    tag
                                        .toLowerCase()
                                        .includes(
                                            query,
                                        ),
                            ));

                    const notExcluded =
                        !excluded.includes(
                            config.format,
                        );

                    const matchesInclude =
                        included.length === 0 ||
                        included.includes(
                            config.format,
                        );

                    return (
                        matchesSearch &&
                        notExcluded &&
                        matchesInclude
                    );
                },
            );

            container.innerHTML = "";

            if (results.length === 0) {
                container.innerHTML =
                    '<p class="status-text">no configs found.</p>';
                return;
            }

            const cards = await Promise.all(
                results.map(renderConfig),
            );

            container.innerHTML =
                cards.join("");
        }

        async function loadConfigs() {
            const container =
                document.getElementById(
                    "configs-container",
                );

            try {
                const response = await fetch(
                    "configs/index.json",
                );

                allConfigs = await response.json();

                if (allConfigs.length === 0) {
                    container.innerHTML =
                        '<p class="status-text">nothing here yet.</p>';
                    return;
                }

                allConfigs.sort(
                    (a, b) =>
                        Number(b.id) -
                        Number(a.id),
                );

                buildFormatPills(allConfigs);
                renderCards("");

                document
                    .getElementById(
                        "search-input",
                    )
                    .addEventListener(
                        "input",
                        (event) => {
                            renderCards(
                                event.target.value,
                            );
                        },
                    );
            } catch (error) {
                container.innerHTML =
                    '<p class="status-text">could not load configs.</p>';

                console.error(error);
            }
        }

        loadConfigs();
    </script>

    <div data-component="footer"></div>
</body>
</html>
