<!doctype html>
<html>
    <head>
        <!-- FIX 1: Active viewport tracking parameters for media queries -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>settings</title>
        <link rel="icon" type="image/png" href="/assets/ansilian.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css?v=1" />
    </head>
    <body>
        <div data-component="navbar"></div>
        <script src="/js/utils.js"></script>
        <script src="/js/components.js"></script>
        <script src="/js/nav.js"></script>

        <main class="page-content">
            <h1 class="page-title">settings</h1>
            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="search by title, author, format or tag..."
                autocomplete="off"
            />
            <div id="configs-container">
                <p class="status-text">loading...</p>
            </div>
        </main>

        <script>
            let allConfigs = [];

            async function renderCards(filter) {
                const container = document.getElementById("configs-container");
                const query = filter.toLowerCase().trim();

                const results = query
                    ? allConfigs.filter((c) => {
                          const inTitle =
                              c.title && c.title.toLowerCase().includes(query);
                          const inAuthor = c.author
                              .toLowerCase()
                              .includes(query);
                          const inFormat = c.format
                              .toLowerCase()
                              .includes(query);
                          const inTags =
                              c.tags &&
                              c.tags.some((t) =>
                                  t.toLowerCase().includes(query),
                              );
                          return inTitle || inAuthor || inFormat || inTags;
                      })
                    : allConfigs;

                container.innerHTML = "";

                if (results.length === 0) {
                    container.innerHTML =
                        '<p class="status-text">no configs found.</p>';
                    return;
                }

                const cards = await Promise.all(results.map((config) =>
                    window.renderComponent("article-card", {
                        idAttr: `config-${config.id}`,
                        href: `reader.html?config=${config.id}`,
                        number: config.id,
                        date: config.date,
                        title: config.title || config.author,
                        metaHtml: `<span class="format-badge format-${config.format}">${config.format}</span>`,
                        descriptionHtml: "",
                        authorHtml: `<div class="card-author-row">${config.author}</div>`,
                        bottomHtml: `<div class="card-tags">${window.AnsilianUtils.renderTags(config.tags)}</div>`,
                    })
                ));

                container.innerHTML = cards.join("");
            }

            async function loadConfigs() {
                const container = document.getElementById("configs-container");

                try {
                    const response = await fetch("configs/index.json");
                    allConfigs = await response.json();

                    if (allConfigs.length === 0) {
                        container.innerHTML =
                            '<p class="status-text">nothing here yet.</p>';
                        return;
                    }

                    allConfigs.sort((a, b) => Number(b.id) - Number(a.id));
                    renderCards("");

                    document
                        .getElementById("search-input")
                        .addEventListener("input", (e) => {
                            renderCards(e.target.value);
                        });
                } catch (error) {
                    container.innerHTML =
                        '<p class="status-text">could not load configs.</p>';
                    console.error(error);
                }
            }

            loadConfigs();
        </script>
        <div data-component="footer"></div>
    </body>
</html>
