<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>sspm archive</title>
        <link rel="icon" type="image/png" href="/assets/ansilian.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Naskh+Arabic:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div data-component="navbar"></div>
        <script src="/js/utils.js"></script>
        <script src="/js/components.js"></script>
        <script src="/js/nav.js"></script>

        <main id="main-content" class="page-content">
            <h1 class="page-title" style="margin-bottom: 24px;">sspm archive</h1>

            <div class="pattern-filter" id="pattern-filter">
                <span class="pattern-filter-label">patterns</span>
                <div class="pattern-pills" id="pattern-pills"></div>
            </div>

            <!-- Balanced layout wrapper matching the search padding and alignment -->
            <div style="display: flex; gap: 12px; margin-bottom: 8px;">
                <label class="sr-only" id="sspm-search-label" for="search-input">Search SSPM archive by name, mapper, archiver, id, or pattern</label>
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    aria-labelledby="sspm-search-label"
                    placeholder="search by name, mapper, archiver, id, or pattern..."
                    autocomplete="off"
                    style="margin-bottom: 0; flex: 1;"
                />
                <button type="button" id="random-btn" class="action-btn" style="width: auto; padding: 14px 24px; white-space: nowrap; height: 100%; box-sizing: border-box;">Random Map</button>
            </div>

            <!-- Total map count placed directly underneath the search bar -->
            <div style="margin-bottom: 20px; padding-left: 4px;">
                <span id="map-counter" class="status-text" style="font-size: 14px; font-weight: 400; color: rgba(255, 255, 255, 0.4);"></span>
            </div>

            <div id="sspm-container" aria-live="polite">
                <p class="status-text">loading...</p>
            </div>
        </main>

        <script>
            let allMaps = [];
            let patternStates = new Map(); // pattern → 0 (neutral), 1 (include), 2 (exclude)

            // Recalibrated low-saturation matte color palette for clean UI contrast
            const ratingColors = {
                's---': { text: '#3b5278', bg: 'rgba(59, 82, 120, 0.12)',  border: 'rgba(59, 82, 120, 0.25)' }, // Deep slate blue
                's--':  { text: '#4dabf7', bg: 'rgba(77, 171, 247, 0.08)',  border: 'rgba(77, 171, 247, 0.2)' },  // Mid denim blue
                's-':   { text: '#a5d8ff', bg: 'rgba(165, 216, 255, 0.06)', border: 'rgba(165, 216, 255, 0.15)' }, // Light ice blue
                'nm':   { text: '#ffffff', bg: 'rgba(255, 255, 255, 0.06)', border: 'rgba(255, 255, 255, 0.15)' }, // Neutral white
                's+':   { text: '#2f9e44', bg: 'rgba(47, 158, 68, 0.1)',    border: 'rgba(47, 158, 68, 0.22)' },  // True flat green
                's++':  { text: '#fcc419', bg: 'rgba(252, 196, 25, 0.06)',  border: 'rgba(252, 196, 25, 0.18)' },  // Muted gold yellow
                's+++': { text: '#fa5252', bg: 'rgba(250, 82, 82, 0.08)',   border: 'rgba(250, 82, 82, 0.18)' },   // Flat matte red
                'default': { text: 'rgba(255, 255, 255, 0.8)', bg: 'rgba(255, 255, 255, 0.04)', border: 'rgba(255, 255, 255, 0.1)' }
            };

            function getRatingStyle(rating) {
                if (!rating) return ratingColors.default;
                const normalized = rating.toLowerCase().trim();
                return ratingColors[normalized] || ratingColors.default;
            }

            function openLink(link) {
                window.open(link, "_blank");
            }

            function buildPatternPills(maps) {
                const patterns = [
                    ...new Set(
                        maps.flatMap((m) =>
                            Array.isArray(m.pattern)
                                ? m.pattern
                                : m.pattern
                                  ? [m.pattern]
                                  : [],
                        ),
                    ),
                ].sort();

                const pillsContainer = document.getElementById("pattern-pills");
                pillsContainer.innerHTML = patterns
                    .map(
                        (p) => `
                        <button type="button" class="pattern-pill" data-pattern="${p}" aria-pressed="false" onclick="togglePattern('${p}', this)">
                            ${p}
                        </button>
                    `,
                    )
                    .join("");
            }

            function togglePattern(pattern, btn) {
                const current = patternStates.get(pattern) || 0;
                const next = (current + 1) % 3;
                patternStates.set(pattern, next);

                btn.classList.remove("include", "exclude");
                if (next === 1) btn.classList.add("include");
                if (next === 2) btn.classList.add("exclude");
                btn.setAttribute("aria-pressed", String(next !== 0));

                renderCards(document.getElementById("search-input").value);
            }

            function buildCard(map) {
                const patternsArray = Array.isArray(map.pattern)
                    ? map.pattern
                    : map.pattern
                      ? [map.pattern]
                      : [];

                const badgesHtml = patternsArray
                    .map((p) => `<span class="pattern-badge">${p}</span>`)
                    .join("");

                const colors = getRatingStyle(map.rating);

                return `
                    <article class="custom-card">
                        <div class="card-top-row">
                            <span class="card-number">#${map.id}</span>
                            <span class="card-dot">·</span>
                            <span class="card-date">${map.date}</span>
                            ${badgesHtml}
                        </div>
                        <div class="card-name">${map.name}</div>
                        <div class="card-mapper">mapped by ${map.mapper}</div>
                        <div class="card-meta-row">
                            <span class="card-rating rating-badge" style="color: ${colors.text}; background: ${colors.bg}; border: 1px solid ${colors.border}; padding: 3px 8px; border-radius: 5px; font-weight: 500; font-size: 13px;">⬦ ${map.rating}</span>
                            <span class="card-archiver">archived by ${map.archiver}</span>
                        </div>
                        <button type="button" class="action-btn" onclick="openLink('${map.link}')">download</button>
                    </article>
                `;
            }

            function renderCards(filter) {
                const container = document.getElementById("sspm-container");
                const counterDisplay = document.getElementById("map-counter");
                const query = filter.toLowerCase().trim();

                const included = [...patternStates.entries()]
                    .filter(([, v]) => v === 1)
                    .map(([k]) => k);
                const excluded = [...patternStates.entries()]
                    .filter(([, v]) => v === 2)
                    .map(([k]) => k);

                const results = allMaps.filter((m) => {
                    const currentPatterns = Array.isArray(m.pattern)
                        ? m.pattern
                        : m.pattern
                          ? [m.pattern]
                          : [];

                    // Broadened search query inclusion parameters to match id and patterns
                    const matchesSearch =
                        !query ||
                        m.name.toLowerCase().includes(query) ||
                        m.mapper.toLowerCase().includes(query) ||
                        m.archiver.toLowerCase().includes(query) ||
                        (m.id && m.id.toString().toLowerCase().includes(query)) ||
                        currentPatterns.some((p) => p.toLowerCase().includes(query));

                    const notExcluded = !currentPatterns.some((p) =>
                        excluded.includes(p),
                    );
                    const matchesInclude =
                        included.length === 0 ||
                        included.every((p) => currentPatterns.includes(p));

                    return matchesSearch && notExcluded && matchesInclude;
                });

                // Update the visual tracker underneath the search bar items dynamically
                if (allMaps.length === results.length) {
                    counterDisplay.textContent = `${allMaps.length} total maps`;
                } else {
                    counterDisplay.textContent = `showing ${results.length} of ${allMaps.length} maps`;
                }

                if (results.length === 0) {
                    container.innerHTML =
                        '<p class="status-text">no maps found.</p>';
                    return;
                }

                container.innerHTML = results.map(buildCard).join("");
            }

            function pickRandomMap() {
                if (allMaps.length === 0) return;

                const randomIndex = Math.floor(Math.random() * allMaps.length);
                const selectedMap = allMaps[randomIndex];

                const searchInput = document.getElementById("search-input");

                patternStates.clear();
                document.querySelectorAll('.pattern-pill').forEach(btn => {
                    btn.classList.remove('include', 'exclude');
                                            btn.setAttribute('aria-pressed', 'false');
                });

                searchInput.value = selectedMap.id;
                searchInput.dispatchEvent(new Event('input'));
                searchInput.focus();
            }

            async function loadMaps() {
                const container = document.getElementById("sspm-container");
                try {
                    const response = await fetch("sspm.json");
                    allMaps = await response.json();

                    if (allMaps.length === 0) {
                        container.innerHTML =
                            '<p class="status-text">nothing here yet.</p>';
                        document.getElementById("map-counter").textContent = "0 total maps";
                        return;
                    }

                    allMaps.sort((a, b) => Number(b.id) - Number(a.id));

                    buildPatternPills(allMaps);
                    renderCards("");

                    document
                        .getElementById("search-input")
                        .addEventListener("input", (e) => {
                            renderCards(e.target.value);
                        });

                    document.getElementById("random-btn").addEventListener("click", pickRandomMap);
                } catch (error) {
                    container.innerHTML =
                        '<p class="status-text">could not load maps.</p>';
                    console.error(error);
                }
            }

            loadMaps();
        </script>
        <div data-component="footer"></div>
    </body>
</html>
