        <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"Archivers | Ansilian","description":"Meet the Ansilian archivers and find links to their profiles and archive roles.","url":"https://wmw-frog-enjoyer.github.io/archivers/","image":"https://wmw-frog-enjoyer.github.io/assets/ansilian.webp","isPartOf":{"@type":"WebSite","name":"Ansilian","url":"https://wmw-frog-enjoyer.github.io/"}}</script>
        <link rel="icon" type="image/png" href="/assets/ansilian.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />

        <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Naskh+Arabic:wght@400..700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="style.css?v=1" />
    </head>

    <body>
        <div data-component="navbar"></div>
        <script src="/js/utils.js"></script>
        <script src="/js/components.js"></script>
        <script src="/js/nav.js"></script>
        <script src="/js/search.js"></script>
        <script src="/js/global-search.js"></script>

        <main id="main-content">
            <h1 class="title">Archivers</h1>
        <p class="subtitle">
            we dont have enough archivers to need a search feature, use ctrl+f instead
        </p>

        <!-- Empty grid container that JS will populate -->
            <section class="grid" id="archivers-grid" aria-label="Archivers list"></section>

            <a class="button-apply" href="https://tally.so/r/kdJ616" target="_blank" rel="noopener noreferrer">
            <p class="button-text">Apply to Ansilian!</p>
            </a>
        </main>

        <!-- Script to load your JSON data dynamically -->
        <script>
            async function loadArchivers() {
                const grid = document.getElementById('archivers-grid');
                try {
                    // Fetch the data file
                    const response = await fetch('archivers.json');
                    const archivers = await response.json();

                    // Map through data and generate the exact HTML blocks your CSS expects
                    grid.innerHTML = archivers.map(user => `
                        <article class="card">
                            <img class="pfp" src="${user.pfp}" alt="${user.name}'s pfp" width="170" height="170" loading="lazy" decoding="async" />
                            <div class="card-content">
                                <h2 class="card-title">${user.name}</h2>
                                <p class="card-text">Role: ${user.role}</p>
                                <p class="card-text">Archiver since: ${user.since}</p>
                                <a class="discord" href="https://discordapp.com/users/${user.discordId}" target="_blank" rel="noopener noreferrer" aria-label="Open ${user.name}'s Discord profile">Discord</a>
                            </div>
                        </article>
                    `).join('');
                } catch (error) {
                    console.error('Failed to load archivers data:', error);
                    grid.innerHTML = `<p style="color: #ff5555; grid-column: 1/-1;">Error loading archivers archive.</p>`;
                }
            }

            // Run it when the page elements are ready
            document.addEventListener('DOMContentLoaded', loadArchivers);
        </script>
        <div data-component="footer"></div>
    </body>
</html>
